name: Build LemburKu APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          test -f LemburKu_Android_Project.zip
          mkdir -p source
          unzip -q LemburKu_Android_Project.zip -d source

      - name: Run tests and build APK
        working-directory: source/LemburKu_Android_Project
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LemburKu-debug-apk
          path: source/LemburKu_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
